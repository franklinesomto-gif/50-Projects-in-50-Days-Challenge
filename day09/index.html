<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 09 - Quiz App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-container">
    <h1>Simple Quiz App</h1>
    <div id="quiz">
      <div class="question-box">
        <h2 id="question">Question goes here</h2>
        <div class="options">
          <button class="option">Option 1</button>
          <button class="option">Option 2</button>
          <button class="option">Option 3</button>
          <button class="option">Option 4</button>
        </div>
      </div>
      <div class="footer">
        <span id="progress">Question 1 of 4</span>
        <button id="next-btn">Next</button>
      </div>
      <div id="result" class="hidden">
        <h2>Your Score: <span id="score">0</span>/4</h2>
        <button onclick="restartQuiz()">Restart Quiz</button>
      </div>
    </div>
  </div>
</body>
</html>
