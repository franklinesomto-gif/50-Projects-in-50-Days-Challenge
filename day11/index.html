<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 11 - Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Weather App ⛅</h1>

    <div class="search-box">
      <input type="text" id="city-input" placeholder="Enter city name e.g Port Harcourt">
      <button onclick="getWeather()">Search</button>
    </div>

    <div id="weather-result" class="hidden">
      <h2 id="city-name">Port Harcourt</h2>
      <div class="temp-box">
        <span id="temperature">30</span><span>°C</span>
      </div>
      <p id="description">Sunny</p>

      <div class="details">
        <div class="detail">
          <span>Humidity</span>
          <span id="humidity">60%</span>
        </div>
        <div class="detail">
          <span>Wind</span>
          <span id="wind">5 km/h</span>
        </div>
        <div class="detail">
          <span>Feels Like</span>
          <span id="feels-like">32°C</span>
        </div>
      </div>
    </div>

    <p id="error" class="hidden">City not found! Try again.</p>
  </div>
</body>
</html>
