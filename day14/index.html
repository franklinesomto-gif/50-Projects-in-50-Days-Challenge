<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h2>Password Generator</h2>
    <div class="result">
      <input type="text" id="password" readonly placeholder="P4$5W0rD!">
      <button id="copy">Copy</button>
    </div>
    
    <div class="control">
      <label>Length: <span id="lenVal">12</span></label>
      <input type="range" id="length" min="4" max="30" value="12">
    </div>

    <div class="control">
      <label><input type="checkbox" id="uppercase" checked> Uppercase (A-Z)</label>
    </div>
    <div class="control">
      <label><input type="checkbox" id="lowercase" checked> Lowercase (a-z)</label>
    </div>
    <div class="control">
      <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
    </div>
    <div class="control">
      <label><input type="checkbox" id="symbols"> Symbols (@#$%)</label>
    </div>

    <button id="generate">Generate Password</button>
  </div>
</body>
</html>
