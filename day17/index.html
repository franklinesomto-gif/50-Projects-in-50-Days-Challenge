<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery - Day 17</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  

  <div class="container">
    <h1>Image Gallery</h1>
    <p class="subtitle">Click any image to view</p>

    <div class="gallery">
      <img src="https://picsum.photos/id/10/400/400" alt="Image 1">
      <img src="https://picsum.photos/id/15/400/400" alt="Image 2">
      <img src="https://picsum.photos/id/28/400/400" alt="Image 3">
      <img src="https://picsum.photos/id/29/400/400" alt="Image 4">
      <img src="https://picsum.photos/id/48/400/400" alt="Image 5">
      <img src="https://picsum.photos/id/65/400/400" alt="Image 6">
    </div>
  </div>
  
  <div id="lightbox" class="lightbox">
    <span id="closeBtn">&times;</span>
    <img id="lightboxImg" src="" alt="">
  </div>

</body>
</html>
