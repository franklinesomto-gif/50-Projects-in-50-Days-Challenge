<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Form Validation Converter</h1>
    
    <form>
      <label>Enter Meters</label>
      <input type="number" required min="1" placeholder="e.g. 1000">
      
      <div class="result-box">
        <p>Kilometers: <b>1 km</b></p>
        <p>Centimeters: <b>100,000 cm</b></p>
        <p>Feet: <b>3,280.84 ft</b></p>
        <small>Example result - real calculation needs JS</small>
      </div>

      <button>Convert</button>
    </form>
  </div>
</body>
</html>
