<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 23 - NewsFlow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-left">
    <h1>NewsFlow</h1>
    <p>Stay updated with latest trends</p>
  </div>
  <div class="header-right">
    <input type="text" id="search" placeholder="Search news...">
    <button onclick="doSearch()">🔍</button>
  </div>
</header>

<div class="cats">
  <button class="active" onclick="setCat('technology', this)">Technology</button>
  <button onclick="setCat('business', this)">Business</button>
  <button onclick="setCat('sports', this)">Sports</button>
  <button onclick="setCat('science', this)">Science</button>
  <button onclick="setCat('nigeria', this)">Nigeria</button>
</div>

<div class="main">
  <div class="featured" id="featured"></div>
  <div class="news-grid" id="result"></div>
</div>
</body>
</html>
