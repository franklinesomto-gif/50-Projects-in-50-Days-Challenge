<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Application-UL</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="avatar">C</div>
    <div>
      <h3>Dave </h3>
      <span>Online now</span>
    </div>
  </div>

  <div class="chat-messages">
    <ul id="messageList">
      <li class="received">wassup Dave how are doing? <span class="time">10:12 AM</span></li>
      <li class="sent">omo am fine bro just wakingup <span class="time">10:13 AM</span></li>
      <li class="received">share hope u slept well? <span class="time">10:14 AM</span></li>
      <li class="sent">i did man, u nko?</li>
      <li class="received">same bro</li>
    </ul>
  </div>

  <div class="chat-input">
    <input type="text" id="msgInput" placeholder="Type message...">
    <button id="sendBtn">➤</button>
  </div>
</div>

</body>
</html>
