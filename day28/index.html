<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopNaija - Products</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>ShopNaija</h2>
  <div class="cart">🛒 <span id="cartCount">0</span></div>
</header>

<div class="products-container">
  <h3>Our Products</h3>

  <ul id="productList">
    <li class="product">
      <img src="https://via.placeholder.com/150" alt="Shoe">
      <h4>Running Shoe</h4>
      <p class="price">₦25,000</p>
      <button class="addBtn">Add to Cart</button>
    </li>

    <li class="product">
      <img src="https://via.placeholder.com/150" alt="Bag">
      <h4>School Bag</h4>
      <p class="price">₦12,000</p>
      <button class="addBtn">Add to Cart</button>
    </li>

    <li class="product">
      <img src="https://via.placeholder.com/150" alt="Watch">
      <h4>Smart Watch</h4>
      <p class="price">₦18,500</p>
      <button class="addBtn">Add to Cart</button>
    </li>

    <li class="product">
      <img src="https://via.placeholder.com/150" alt="Headset">
      <h4>Headset</h4>
      <p class="price">₦8,000</p>
      <button class="addBtn">Add to Cart</button>
    </li>
  </ul>
</div>

<script src="script.js"></script>
</body>
</html>
