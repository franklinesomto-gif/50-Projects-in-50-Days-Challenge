<!DOCTYPE html>
<html>
<head>
  <title>ShopNaija - New</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <h1>SHOPNAIJA</h1>
    <span id="cart">Cart (0)</span>
  </nav>

  <main>
    <h2>All Products</h2>

    <ul class="grid-products">
      <li>
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="shoe">
        <h3>Running Shoe</h3>
        <p>Strong sole, good for jogging</p>
        <strong>₦25,000</strong>
        <button>Add to Cart</button>
      </li>

      <li>
        <img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141" alt="spaghetti">
        <h3>Spaghetti Pack</h3>
        <p>1kg Golden Penny Pasta</p>
        <strong>₦1,200</strong>
        <button>Add to Cart</button>
      </li>

      <li>
        <img src="https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77" alt="shoe 2">
        <h3>Leather Shoe</h3>
        <p>Office shoe, brown color</p>
        <strong>₦32,000</strong>
        <button>Add to Cart</button>
      </li>

      <li>
        <img src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9" alt="spaghetti 2">
        <h3>Jollof Spaghetti</h3>
        <p>Ready to cook, tasty</p>
        <strong>₦2,500</strong>
        <button>Add to Cart</button>
      </li>
    </ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
