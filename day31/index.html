<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Apl</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Student Registration</h2>
        <form>
            <label for="name"> Full Name:</label>
             <input type="text" placeholder="Enter your full name" required> <br>

            <label for="email">Email Address:</label>
            <input type="text" placeholder="Enter your Email" required> <br>

            <label for="studentld">student lD:</label>
            <input type="text" placeholder="e.g 1287599" required> <br>

            <label for="course">Course:</label>
            <select>
                <option value="computer science">Computer Science</option>
                <option value="mathematics">Mathematics</option>
                <option value="physics">Physics</option>
                <option value="chemistry">Chemistry</option>
                </select> <br>

            <button type="submit">Register </button>
        </form>
    </div>
</body>

</html>
